<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,user-scalable=no">
<title>Paper DJ</title>
<style>
  :root {
    --bg: #111214; --panel: #1b1d21; --line: #2c2f35; --text: #ecebe6; --dim: #8d9098;
    --a: #6aa0f2; --b: #ee7f73; --purple: #b48ce8; --green: #8fd694; --yellow: #f2d06b;
    --good: #6ccf8e; --bad: #ef6461;
  }
  * { box-sizing: border-box; }
  html { -webkit-text-size-adjust: 100%; }
  body { margin: 0 auto; background: var(--bg); color: var(--text); max-width: 860px; padding: 16px;
         font: 14px/1.4 ui-sans-serif, system-ui, -apple-system, "Segoe UI", sans-serif;
         -webkit-tap-highlight-color: transparent; -webkit-user-select: none; user-select: none; }
  header { display: flex; align-items: baseline; justify-content: space-between; margin-bottom: 10px; }
  h1 { font-size: 17px; letter-spacing: .06em; margin: 0; font-weight: 700; }
  h1 span { color: var(--dim); font-weight: 400; letter-spacing: 0; }
  #start { width: 100%; padding: 18px; font-size: 17px; font-weight: 650; border: 0; border-radius: 12px;
           background: var(--text); color: var(--bg); }
  #start.on { background: var(--panel); color: var(--good); border: 1px solid var(--line); padding: 10px; font-size: 14px; }
  .meters { display: grid; grid-template-columns: repeat(6, 1fr); gap: 6px; margin: 10px 0; }
  .meter { background: var(--panel); border: 1px solid var(--line); border-radius: 8px; padding: 6px 8px; min-width: 0; }
  .meter b { display: block; font-size: 15px; font-variant-numeric: tabular-nums; white-space: nowrap; }
  .meter small { color: var(--dim); font-size: 11px; white-space: nowrap; }
  .ok { color: var(--good); } .warn { color: var(--bad); }

  .board { display: grid; grid-template-columns: 1fr minmax(0, 1.25fr) 1fr; gap: 10px; align-items: start; }
  .hand { background: var(--panel); border: 1px solid var(--line); border-radius: 12px; padding: 10px; min-width: 0; }
  .hand h2 { margin: 0; font-size: 14px; display: flex; justify-content: space-between; }
  .hand[data-d="a"] h2 { color: var(--a); } .hand[data-d="b"] h2 { color: var(--b); }
  .hand .meta { color: var(--dim); font-size: 12px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .track { position: relative; height: 8px; background: var(--line); border-radius: 4px; margin: 8px 0 10px; }
  .track .pos { position: absolute; top: 0; bottom: 0; left: 0; border-radius: 4px; opacity: .8; }
  .hand[data-d="a"] .pos { background: var(--a); } .hand[data-d="b"] .pos { background: var(--b); }
  .track .loop { position: absolute; top: -2px; bottom: -2px; background: rgba(180,140,232,.45); border-radius: 2px; display: none; }
  .track .hc { position: absolute; top: -4px; width: 3px; height: 16px; background: var(--text); display: none; }
  .phase { display: flex; gap: 3px; margin-bottom: 8px; }
  .phase i { flex: 1; height: 4px; border-radius: 2px; background: var(--line); }
  .phase i.on { background: var(--text); }

  label { display: grid; grid-template-columns: 52px 1fr 40px; align-items: center; gap: 6px;
          font-size: 12px; color: var(--dim); margin: 6px 0; }
  label output { text-align: right; font-variant-numeric: tabular-nums; color: var(--text); font-size: 11px; }
  input[type=range] { width: 100%; accent-color: var(--text); margin: 0; }
  .jog { position: relative; width: 132px; height: 132px; margin: 10px auto 4px; border-radius: 50%;
         background: radial-gradient(circle, #2a2d33 0 18%, #1f2125 19% 62%, #2a2d33 63% 100%);
         border: 2px solid var(--line); touch-action: none; cursor: grab; }
  .jog.held { border-color: var(--text); cursor: grabbing; }
  .jog .mark { position: absolute; left: 50%; top: 6px; width: 4px; height: 26px; margin-left: -2px; border-radius: 2px;
               transform-origin: 2px 60px; }
  .hand[data-d="a"] .jog .mark { background: var(--a); } .hand[data-d="b"] .jog .mark { background: var(--b); }
  .jog-label { text-align: center; color: var(--dim); font-size: 11px; }

  .pads { display: grid; grid-template-columns: repeat(4, 1fr); gap: 7px; }
  .pad { aspect-ratio: 1; border-radius: 9px; border: 3px solid #0b0c0d; display: flex; flex-direction: column;
         align-items: center; justify-content: center; text-align: center; padding: 2px; min-width: 0;
         font-weight: 700; color: #16181b; transition: filter .08s, box-shadow .08s; touch-action: manipulation; }
  .pad b { font-size: 20px; line-height: 1; }
  .pad span { font-size: 10px; font-weight: 600; margin-top: 4px; letter-spacing: .02em; }
  .pad { filter: saturate(.55) brightness(.62); }
  .pad.lit { filter: none; box-shadow: 0 0 14px rgba(255,255,255,.35); }
  .pad:active { filter: brightness(1.15); }
  .c-a { background: var(--a); } .c-b { background: var(--b); } .c-p { background: var(--purple); }
  .c-g { background: var(--green); } .c-y { background: var(--yellow); }

  .mixer { background: var(--panel); border: 1px solid var(--line); border-radius: 12px; padding: 10px; margin-top: 10px; }
  .row { display: flex; gap: 8px; flex-wrap: wrap; align-items: center; }
  .row button, details button, select { padding: 7px 10px; border-radius: 7px; border: 1px solid var(--line);
         background: #24272c; color: var(--text); font-size: 12px; }
  details { margin-top: 8px; color: var(--dim); font-size: 12px; }
  summary { cursor: pointer; padding: 4px 0; }
  pre { white-space: pre-wrap; font-size: 11px; background: var(--panel); padding: 10px; border-radius: 8px; user-select: text; }

  @media (max-width: 640px) {
    .board { grid-template-columns: 1fr 1fr; }
    .pads-wrap { grid-column: 1 / -1; order: -1; }
    .meters { grid-template-columns: repeat(3, 1fr); }
    .jog { width: 116px; height: 116px; } .jog .mark { transform-origin: 2px 52px; }
  }
</style>
</head>
<body>
<header><h1>PAPER DJ <span>· monitor &amp; test board</span></h1><small id="conn" class="warn">offline</small></header>
<button id="start">Tap to start audio</button>

<div class="meters">
  <div class="meter"><small>phone buffer</small><b id="m-buf">–</b></div>
  <div class="meter"><small>dropouts</small><b id="m-under">0</b></div>
  <div class="meter"><small>Pi misses</small><b id="m-miss">–</b></div>
  <div class="meter"><small>cmd → audio</small><b id="m-cmd">–</b></div>
  <div class="meter"><small>render</small><b id="m-render">–</b></div>
  <div class="meter"><small>audio priority</small><b id="m-rt">–</b></div>
</div>

<div class="board">
  <!-- left hand = deck A -->
  <section class="hand" data-d="a"></section>
  <div class="pads-wrap"><div class="pads" id="pads"></div></div>
  <!-- right hand = deck B -->
  <section class="hand" data-d="b"></section>
</div>

<div class="mixer">
  <label>A ↔ B <input type="range" data-p="xfade" min="0" max="1" step="0.01" value="0.5"><output></output></label>
  <label>master <input type="range" data-p="master" min="0" max="1" step="0.01" value="0.9"><output></output></label>
  <label>sample 1 <input type="range" data-p="s1.vol" min="0" max="1" step="0.01" value="0.8"><output></output></label>
  <label>sample 2 <input type="range" data-p="s2.vol" min="0" max="1" step="0.01" value="0.8"><output></output></label>
  <label>latency <input type="range" id="target" min="40" max="300" step="10" value="100"><output></output></label>
  <div class="row"><button id="quant">Quantize: on</button></div>
</div>

<details><summary>Raw engine state</summary><pre id="debug"></pre></details>

<template id="hand-tpl">
  <h2><span class="title"></span><span class="bpm"></span></h2>
  <div class="meta name">–</div>
  <div class="track"><div class="pos"></div><div class="loop"></div><div class="hc h0"></div><div class="hc h1"></div></div>
  <div class="phase"><i></i><i></i><i></i><i></i></div>
  <label>volume <input type="range" data-p="D.vol" min="0" max="1" step="0.01" value="0.8"><output></output></label>
  <label>filter <input type="range" data-p="D.filter" min="-1" max="1" step="0.01" value="0" class="center"><output></output></label>
  <div class="jog"><div class="mark"></div></div>
  <div class="jog-label">scratch: drag around</div>
  <details><summary>EQ · tempo · FX · loop</summary>
    <label>high <input type="range" data-p="D.high" min="-40" max="6" step="0.5" value="0"><output></output></label>
    <label>mid <input type="range" data-p="D.mid" min="-40" max="6" step="0.5" value="0"><output></output></label>
    <label>low <input type="range" data-p="D.low" min="-40" max="6" step="0.5" value="0"><output></output></label>
    <label>tempo <input type="range" data-p="D.rate" min="0.84" max="1.16" step="0.001" value="1"><output></output></label>
    <label>fx amt <input type="range" data-p="D.fxamt" min="0" max="1" step="0.01" value="0.5"><output></output></label>
    <div class="row">
      <select class="looplen"><option>1</option><option>2</option><option selected>4</option><option>8</option><option>16</option></select>
      <span>beat loop</span>
      <button class="clear">Clear hot cues</button>
    </div>
  </details>
</template>

<script>
"use strict";
const $ = id => document.getElementById(id);

/* ======================= audio: stream from the Pi ======================= */
// Raw little-endian int16, stereo, 48 kHz over plain HTTP.
const SRC_RATE = 48000, CAP = 1 << 16;
const ringL = new Float32Array(CAP), ringR = new Float32Array(CAP);
let wPos = 0, rPos = 0, buffering = true, underruns = 0, skips = 0;
let targetMs = 100, ctx = null, step = 1;
const buffered = () => wPos - rPos;

async function pump() {
  for (;;) {
    try {
      const res = await fetch("/stream", { cache: "no-store" });
      const reader = res.body.getReader();
      let carry = new Uint8Array(0);
      for (;;) {
        const { value, done } = await reader.read();
        if (done) break;
        let bytes = value;
        if (carry.length) { const m = new Uint8Array(carry.length + bytes.length); m.set(carry); m.set(bytes, carry.length); bytes = m; }
        const frames = bytes.length >> 2;
        const dv = new DataView(bytes.buffer, bytes.byteOffset, frames * 4);
        for (let i = 0; i < frames; i++) {
          const j = wPos & (CAP - 1);
          ringL[j] = dv.getInt16(i * 4, true) / 32768;
          ringR[j] = dv.getInt16(i * 4 + 2, true) / 32768;
          wPos++;
        }
        carry = bytes.slice(frames * 4);
        if (buffered() > CAP - 4096) { rPos = wPos - targetMs * 48; skips++; }
      }
    } catch (err) { console.warn("stream dropped", err); }
    buffering = true;
    await new Promise(r => setTimeout(r, 500));
  }
}

function onAudio(e) {
  const L = e.outputBuffer.getChannelData(0), R = e.outputBuffer.getChannelData(1);
  const n = L.length, target = targetMs * 48, maxBuf = target + 9600;
  if (buffering) {
    if (buffered() < target) { L.fill(0); R.fill(0); return; }
    buffering = false;
  }
  if (buffered() > maxBuf) { rPos = wPos - target; skips++; }
  // Pi and phone clocks differ slightly: nudge speed by <= 0.3% to hold the buffer.
  const adj = Math.max(-0.003, Math.min(0.003, (buffered() - target) / target * 0.002));
  const s = step * (1 + adj);
  for (let i = 0; i < n; i++) {
    if (wPos - rPos < 2) { L.fill(0, i); R.fill(0, i); underruns++; buffering = true; return; }
    const k = Math.floor(rPos), f = rPos - k, a = k & (CAP - 1), b = (k + 1) & (CAP - 1);
    L[i] = ringL[a] + (ringL[b] - ringL[a]) * f;
    R[i] = ringR[a] + (ringR[b] - ringR[a]) * f;
    rPos += s;
  }
}

$("start").addEventListener("click", async () => {
  if (ctx) { await ctx.resume(); return; }
  try { if (navigator.audioSession) navigator.audioSession.type = "playback"; } catch (_) {}
  try { ctx = new AudioContext({ sampleRate: SRC_RATE, latencyHint: "interactive" }); }
  catch (_) { ctx = new AudioContext({ latencyHint: "interactive" }); }
  step = SRC_RATE / ctx.sampleRate;
  // ScriptProcessorNode works on plain http:// pages (AudioWorklet needs https).
  const node = ctx.createScriptProcessor(1024, 0, 2);
  node.onaudioprocess = onAudio;
  node.connect(ctx.destination);
  await ctx.resume();
  $("start").textContent = "Audio on · " + ctx.sampleRate + " Hz";
  $("start").classList.add("on");
  pump();
});

/* ===================== controls: ordered command queue =================== */
// Commands go out strictly in order (scratch on -> platter moves -> scratch off),
// batched into one request while the previous one is in flight.
const queue = [];
let inflight = false;
async function drain() {
  if (inflight) return;
  inflight = true;
  while (queue.length) {
    const batch = queue.splice(0, queue.length).join(";");
    try { await fetch("/cmd?c=" + encodeURIComponent(batch), { cache: "no-store" }); } catch (_) {}
  }
  inflight = false;
}
function send(cmd) { flushParams(); queue.push(cmd); drain(); }

// Continuous values: only the latest value per control is sent (~40 Hz).
const params = new Map();
let paramTimer = null;
function flushParams() {
  if (paramTimer) { clearTimeout(paramTimer); paramTimer = null; }
  if (!params.size) return;
  queue.push([...params].map(([k, v]) => k + " " + v).join(";"));
  params.clear();
  drain();
}
function setParam(k, v) {
  params.set(k, v);
  if (!paramTimer) paramTimer = setTimeout(flushParams, 25);
}

/* ============================== the board =============================== */
// Must match PAD_MAP in src/mixer.c.
const PADS = [
  [1, "PLAY A", "c-a"],      [2, "CUE A", "c-a"],       [3, "PLAY B", "c-b"],      [4, "CUE B", "c-b"],
  [5, "HOT CUE 1 A", "c-a"], [6, "HOT CUE 2 A", "c-a"], [7, "HOT CUE 1 B", "c-b"], [8, "HOT CUE 2 B", "c-b"],
  [9, "LOOP A", "c-p"],      [10, "SYNC A", "c-p"],     [11, "LOOP B", "c-p"],     [12, "SYNC B", "c-p"],
  [13, "FX A", "c-g"],       [14, "SAMPLE 1", "c-g"],   [15, "FX B", "c-y"],       [16, "SAMPLE 2", "c-y"],
];
const padEls = {};
for (const [n, label, cls] of PADS) {
  const el = document.createElement("button");
  el.className = "pad " + cls;
  el.innerHTML = `<b>${n}</b><span>${label}</span>`;
  el.addEventListener("pointerdown", ev => { ev.preventDefault(); send("pad " + n); });
  $("pads").appendChild(el);
  padEls[n] = el;
}

function bindSlider(inp) {
  const out = inp.nextElementSibling;
  const fmt = () => {
    const v = +inp.value;
    if (inp.dataset.p.endsWith(".filter")) out.textContent = v < -0.02 ? "LP" : v > 0.02 ? "HP" : "off";
    else out.textContent = v.toFixed(+inp.step < 0.01 ? 3 : 2);
  };
  fmt();
  inp.addEventListener("input", () => {
    if (inp.dataset.p.endsWith(".filter") && Math.abs(+inp.value) < 0.04) inp.value = 0;  // centre detent
    fmt();
    setParam(inp.dataset.p, inp.value);
  });
  inp.addEventListener("dblclick", () => { inp.value = inp.defaultValue; inp.dispatchEvent(new Event("input")); });
}

const hands = {};
for (const sec of document.querySelectorAll(".hand")) {
  const d = sec.dataset.d;
  sec.appendChild($("hand-tpl").content.cloneNode(true));
  sec.querySelector(".title").textContent = d === "a" ? "Deck A" : "Deck B";
  sec.querySelector(".jog-label").textContent = (d === "a" ? "left" : "right") + " hand · drag to scratch";
  sec.querySelectorAll("input[data-p]").forEach(inp => { inp.dataset.p = inp.dataset.p.replace("D.", d + "."); bindSlider(inp); });
  sec.querySelector(".looplen").addEventListener("change", e => send(`${d}.looplen ${e.target.value}`));
  sec.querySelector(".clear").addEventListener("click", () => send(`${d}.hotcue.clear 1;${d}.hotcue.clear 2`));

  // Scratch platter: drag around the circle. Angle is unwrapped so several turns add up.
  const jog = sec.querySelector(".jog"), mark = sec.querySelector(".mark");
  let held = false, last = 0, total = 0, shown = 0;
  const angleOf = ev => {
    const r = jog.getBoundingClientRect();
    return Math.atan2(ev.clientY - (r.top + r.height / 2), ev.clientX - (r.left + r.width / 2)) * 180 / Math.PI;
  };
  jog.addEventListener("pointerdown", ev => {
    ev.preventDefault();
    jog.setPointerCapture(ev.pointerId);
    held = true; last = angleOf(ev); total = 0;
    jog.classList.add("held");
    send(`${d}.scratch 1;${d}.platter 0`);
  });
  jog.addEventListener("pointermove", ev => {
    if (!held) return;
    const a = angleOf(ev);
    let delta = a - last;
    if (delta > 180) delta -= 360;
    if (delta < -180) delta += 360;
    last = a; total += delta;
    mark.style.transform = `rotate(${shown + total}deg)`;
    setParam(`${d}.platter`, total.toFixed(1));
  });
  const release = () => {
    if (!held) return;
    held = false; shown += total;
    jog.classList.remove("held");
    send(`${d}.scratch 0`);
  };
  jog.addEventListener("pointerup", release);
  jog.addEventListener("pointercancel", release);

  hands[d] = {
    bpm: sec.querySelector(".bpm"), name: sec.querySelector(".name"), pos: sec.querySelector(".pos"),
    loop: sec.querySelector(".loop"), hc: [sec.querySelector(".h0"), sec.querySelector(".h1")],
    phase: [...sec.querySelectorAll(".phase i")], spinner: mark, held: () => held,
  };
}
document.querySelectorAll(".mixer input[data-p]").forEach(bindSlider);

let quant = true;
$("quant").addEventListener("click", () => { quant = !quant; send("quantize " + (quant ? 1 : 0)); });
const tgt = $("target"), tgtOut = tgt.nextElementSibling;
tgt.addEventListener("input", () => { targetMs = +tgt.value; tgtOut.textContent = tgt.value + "ms"; });
tgtOut.textContent = tgt.value + "ms";

/* ============================== live state ============================== */
async function poll() {
  $("m-buf").textContent = ctx ? Math.round(buffered() / 48) + " ms" : "–";
  $("m-under").textContent = underruns + (skips ? "/" + skips : "");
  $("m-under").className = underruns ? "warn" : "ok";
  try {
    const s = await (await fetch("/stats", { cache: "no-store" })).json();
    $("conn").textContent = "connected"; $("conn").className = "ok";
    $("m-miss").textContent = s.deadline_misses;
    $("m-miss").className = s.deadline_misses ? "warn" : "ok";
    $("m-cmd").textContent = s.cmd_lat_us >= 1000 ? (s.cmd_lat_us / 1000).toFixed(1) + " ms" : Math.round(s.cmd_lat_us) + " µs";
    $("m-render").textContent = Math.round(s.render_us) + " µs · " + s.cpu_pct.render.toFixed(1) + "%";
    // audio is protected only if the renderer AND every phone stream got real-time priority
    const allRt = s.realtime && s.rt_streams === s.clients;
    $("m-rt").textContent = allRt ? `FIFO ${s.prio.render}/${s.prio.stream}` : "normal";
    $("m-rt").className = allRt ? "ok" : "warn";
    $("quant").textContent = "Quantize: " + (s.quantize ? "on" : "off");
    quant = !!s.quantize;

    const [A, B] = s.decks;
    const lit = {
      1: A.playing, 3: B.playing,
      2: !A.playing && A.cue > 0, 4: !B.playing && B.cue > 0,
      5: A.hotcues[0] >= 0, 6: A.hotcues[1] >= 0, 7: B.hotcues[0] >= 0, 8: B.hotcues[1] >= 0,
      9: A.loop, 10: A.sync, 11: B.loop, 12: B.sync,
      13: A.fx, 14: s.samples[0].playing, 15: B.fx, 16: s.samples[1].playing,
    };
    for (const n in lit) padEls[n].classList.toggle("lit", !!lit[n]);

    s.decks.forEach((dk, i) => {
      const h = hands["ab"[i]];
      h.bpm.textContent = dk.bpm ? dk.eff_bpm.toFixed(1) + " BPM" : "";
      const ended = !dk.playing && dk.len && dk.pos >= dk.len - 0.5;
      h.name.textContent = ended ? "■ end of song · press Play to restart"
                                 : (dk.scratching ? "◉ " : dk.playing ? "▶ " : "❚❚ ") + dk.name;
      const pct = t => dk.len ? (100 * t / dk.len) + "%" : "0";
      h.pos.style.width = pct(dk.pos);
      h.loop.style.display = dk.loop ? "block" : "none";
      if (dk.loop) { h.loop.style.left = pct(dk.loop_in); h.loop.style.width = dk.len ? (100 * (dk.loop_out - dk.loop_in) / dk.len) + "%" : 0; }
      dk.hotcues.forEach((t, k) => { h.hc[k].style.display = t >= 0 ? "block" : "none"; if (t >= 0) h.hc[k].style.left = pct(t); });
      const beat = Math.floor(((dk.pos - 0) * (dk.bpm || 120) / 60) % 4 + 4) % 4;
      h.phase.forEach((el, k) => el.classList.toggle("on", dk.playing && k === beat));
    });
    $("debug").textContent = JSON.stringify(s, null, 1);
  } catch (_) {
    $("conn").textContent = "offline"; $("conn").className = "warn";
  }
}
setInterval(poll, 250);
poll();
</script>
</body>
</html>
